# Default deployment: one board, external real Jira and Mattermost.
name: worklog-kanban-prod
services:
  board:
    image: ${WORKLOG_IMAGE:?Set WORKLOG_IMAGE to the CI-built image tag or digest}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    ports:
      - "${WORKLOG_BIND_ADDRESS:-127.0.0.1}:${WORKLOG_PORT:-4173}:4173"
    volumes:
      - board-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  board-data:
