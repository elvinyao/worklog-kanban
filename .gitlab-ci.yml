# Requires a privileged GitLab Docker executor. The registry is GitLab's registry.
stages: [test, build]

.docker-job:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    DOCKER_BUILDKIT: "1"

test:
  extends: .docker-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build --build-arg "PYTHON_IMAGE=$(sed -n 's/^PYTHON_IMAGE=//p' .agent/images.lock)" --build-arg "NODE_IMAGE=$(sed -n 's/^NODE_IMAGE=//p' .agent/images.lock)" --tag worklog-kanban-ci-runtime .agent
    - docker build --file .agent/ci.Dockerfile --tag worklog-kanban-ci-test .
    - docker run --rm --init worklog-kanban-ci-test

build-production:
  extends: .docker-job
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - test -f "$WORKLOG_SITE_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use --driver docker-container
  script:
    - export SITE_CONFIG_DIGEST="$(sha256sum "$WORKLOG_SITE_CONFIG" | cut -d ' ' -f 1)"
    - docker buildx build --target production --secret "id=site_config,src=$WORKLOG_SITE_CONFIG" --build-arg "SITE_CONFIG_DIGEST=$SITE_CONFIG_DIGEST" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --load .
    - docker run --rm -i --init --network none --read-only --tmpfs /tmp --entrypoint python "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" - < scripts/verify-production-image.py
    - docker buildx build --target extension --secret "id=site_config,src=$WORKLOG_SITE_CONFIG" --build-arg "SITE_CONFIG_DIGEST=$SITE_CONFIG_DIGEST" --output type=local,dest=dist/ci .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  artifacts:
    name: "worklog-extension-$CI_COMMIT_SHA"
    paths: [dist/ci/extension/]
    expire_in: 30 days
